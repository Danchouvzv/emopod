<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EMOPOD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>EMOPOD Dashboard</h1>
                <button onclick="logout()" class="btn btn-secondary" style="width: auto;">Logout</button>
            </header>

            <div id="message-container"></div>

            <div class="emotion-form">
                <h2>Record Your Emotion</h2>
                <form id="emotion-form" onsubmit="recordEmotion(event)">
                    <div class="form-group">
                        <label for="emotion">How are you feeling?</label>
                        <select id="emotion" required class="form-control">
                            <option value="">Select an emotion...</option>
                            <option value="Happy">Happy</option>
                            <option value="Sad">Sad</option>
                            <option value="Excited">Excited</option>
                            <option value="Anxious">Anxious</option>
                            <option value="Calm">Calm</option>
                            <option value="Angry">Angry</option>
                            <option value="Frustrated">Frustrated</option>
                            <option value="Content">Content</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="note">Add a note (optional)</label>
                        <textarea id="note" rows="3" class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Record Emotion</button>
                </form>
            </div>

            <div class="emotions-section">
                <h2>Your Emotion History</h2>
                <div id="emotions-list" class="emotions-list">
                    <!-- Emotions will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
